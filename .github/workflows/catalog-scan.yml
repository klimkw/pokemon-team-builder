name: Production catalog scan
on:
  schedule:
    - cron: '23 10 * * *' # 10:23 UTC; DST changes the corresponding local time.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-catalog-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require database secret
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: test -n "$DATABASE_URL" || { echo 'Set PRODUCTION_DATABASE_URL in the production environment secrets'; exit 1; }
      - name: Build the locked scanner image
        run: docker build -t pokemon-scanner ./backend
      - name: Scan catalog and type relations once
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: docker run --rm --env DATABASE_URL --env ENABLE_DEMO_CONTROLS=false pokemon-scanner python -m app.jobs.scanner
