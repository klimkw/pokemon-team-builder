name: Tests
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Backend, frontend, build, and browser tests
        run: bash scripts/test.sh
      - name: Save coverage and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
  demo-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the demo image
        run: bash scripts/test-demo.sh
      - name: Save demo container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-smoke-reports
          path: test-artifacts/demo/
          if-no-files-found: warn
          retention-days: 14
