services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pokemon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemon"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pokemon:${POSTGRES_PASSWORD}@db:5432/pokemon
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CHANGE_ALERT_WINDOW_DAYS: ${CHANGE_ALERT_WINDOW_DAYS:-7}
      CATALOG_SCAN_INTERVAL_HOURS: ${CATALOG_SCAN_INTERVAL_HOURS:-24}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
  scanner:
    build: ./backend
    command: ["python", "-m", "app.jobs.scanner", "--schedule"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgresql+asyncpg://pokemon:${POSTGRES_PASSWORD}@db:5432/pokemon
      CATALOG_SCAN_INTERVAL_HOURS: ${CATALOG_SCAN_INTERVAL_HOURS:-24}
      CHANGE_ALERT_WINDOW_DAYS: ${CHANGE_ALERT_WINDOW_DAYS:-7}
    depends_on:
      api:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  postgres_data:

