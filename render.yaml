# Legacy bootstrap reference. For existing resources use infra/terraform/README.md.
# Disconnect Blueprint syncing before Terraform takes ownership of this service.
services:
  - type: web
    name: pokemon-team-builder
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_DEMO_CONTROLS
        value: "true"
      - key: DEMO_EXECUTION_MODE
        value: "request"
      - key: DEMO_MODE
        value: "false"
      - key: CATALOG_SCAN_INTERVAL_HOURS
        value: "24"
      - key: CHANGE_ALERT_WINDOW_DAYS
        value: "7"
