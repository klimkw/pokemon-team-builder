[project]
name = "pokemon-team-builder-backend"
version = "0.1.0"
description = "FastAPI API and separately scheduled Pokemon catalog scanner"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi-users[sqlalchemy]==14.0.2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "aiosqlite>=0.20,<1",
]

[tool.uv]
package = false
