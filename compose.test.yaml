# Standalone file: do not merge with compose.yaml. No development .env references.
name: pokemon-team-builder-tests
services:
  db-test:
    image: postgres:17
    environment:
      POSTGRES_DB: pokemon_test
      POSTGRES_USER: pokemon_test
      POSTGRES_PASSWORD: disposable_test_password
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon_test -d pokemon_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    volumes:
      - ./test-artifacts:/artifacts
    environment:
      COVERAGE_FILE: /tmp/.coverage
      TEST_DATABASE_URL: postgresql+asyncpg://pokemon_test:disposable_test_password@db-test:5432/pokemon_test
    depends_on:
      db-test:
        condition: service_healthy
  api-test:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pokemon_test:disposable_test_password@db-test:5432/pokemon_test
      APP_ORIGIN: ${TEST_APP_ORIGIN:-http://frontend-test}
      COOKIE_SECURE: "false"
      ENABLE_DEMO_CONTROLS: "true"
    networks:
      default:
        aliases: [api]
    depends_on:
      db-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${TEST_FRONTEND_PORT:-18080}:80"
    depends_on:
      api-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 2s
      timeout: 5s
      retries: 30
  frontend-tests:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build
    command: ["npm", "test"]
    volumes:
      - ./test-artifacts:/artifacts
  catalog-fixture:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    command: ["python", "-m", "tests.seed_catalog"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://pokemon_test:disposable_test_password@db-test:5432/pokemon_test
    depends_on:
      api-test:
        condition: service_healthy
  scanner-test:
    build: ./backend
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pokemon_test:disposable_test_password@db-test:5432/pokemon_test
      ENABLE_DEMO_CONTROLS: "true"
    depends_on:
      api-test:
        condition: service_healthy
  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    init: true
    shm_size: 1gb
    environment:
      E2E_BASE_URL: http://frontend-test
      PLAYWRIGHT_OUTPUT_DIR: /artifacts/test-results
      PLAYWRIGHT_REPORT_DIR: /artifacts/playwright-report
    volumes:
      - ./test-artifacts:/artifacts
    depends_on:
      frontend-test:
        condition: service_healthy
      catalog-fixture:
        condition: service_completed_successfully
      scanner-test:
        condition: service_started
